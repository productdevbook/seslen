name: Release

permissions:
  contents: write
  id-token: write

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 👀 Lint
        run: pnpm lint

      - name: 🔍 Typecheck
        run: pnpm typecheck

      - name: 🧪 Test
        run: pnpm test

      - name: 🚀 Build
        run: pnpm build

      - name: 📐 Bundle size budget
        run: pnpm bundle-budget

      - name: 🔍 Are The Types Wrong (ATTW)
        run: pnpm attw

      - name: 📦 Publish to npm
        # Skip cleanly if this version was already published (e.g. a
        # re-run after an unrelated step failed). Anything else still
        # fails the job.
        run: |
          set +e
          out=$(pnpm publish --provenance --access public --no-git-checks 2>&1)
          status=$?
          echo "$out"
          if [ $status -ne 0 ]; then
            if echo "$out" | grep -q "previously published versions"; then
              echo "::notice::npm version already published — skipping"
              exit 0
            fi
            exit $status
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 🦕 Publish to JSR (OIDC)
        # Same idempotency contract: re-running a release shouldn't
        # double-publish, but a missing JSR push (which is what dragged
        # down v0.1.0) should still recover on a re-run.
        run: |
          set +e
          out=$(npx jsr publish 2>&1)
          status=$?
          echo "$out"
          if [ $status -ne 0 ]; then
            if echo "$out" | grep -q "already exists"; then
              echo "::notice::JSR version already published — skipping"
              exit 0
            fi
            exit $status
          fi

      - name: 📝 Generate changelog
        run: pnpm dlx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 💖 Append sponsor footer to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          current=$(gh release view "$TAG" --json body -q .body)
          footer=$'\n\n---\n\n### 💖 Support seslen\n\nIf seslen saves you engineering time, consider [sponsoring on GitHub](https://github.com/sponsors/productdevbook) — it keeps the next preset pack and adapter shipping.\n\n<a href="https://github.com/sponsors/productdevbook"><img src="https://cdn.jsdelivr.net/gh/productdevbook/static/sponsors.svg" alt="Sponsors" /></a>'
          printf '%s%s' "$current" "$footer" | gh release edit "$TAG" --notes-file -

      - name: 📊 Summary
        run: |
          echo "## Release Complete 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
